<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>yt-dlp web</title>
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --accent: #dc2626; --accent-text: #fff;
    --ok: #16a34a; --err: #dc2626; --bar: #e7e5e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --accent: #ef4444; --bar: #292524;
      --ok: #4ade80; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-tap-highlight-color: transparent; }
  main {
    max-width: 760px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 15px; margin: 32px 0 12px; color: var(--muted); font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  .url-row { flex: 1 1 320px; min-width: 0; display: flex; gap: 8px; }
  .controls { display: flex; gap: 8px; }
  input[type=url] {
    flex: 1; min-width: 0; min-height: 44px; padding: 10px 12px; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  select {
    min-height: 44px; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  button {
    min-height: 44px; padding: 10px 16px; touch-action: manipulation; font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: default; }
  button.small { min-height: 36px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
  #paste[hidden] { display: none; }
  .preview { display: none; gap: 12px; margin-top: 14px; align-items: center; }
  .preview.show { display: flex; }
  .preview img, .job img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--bar); flex: none; }
  .meta { color: var(--muted); font-size: 13px; }
  .msg { margin-top: 10px; font-size: 14px; color: var(--err); }
  .msg:empty { display: none; }
  .jobs { display: flex; flex-direction: column; gap: 10px; }
  .job { display: flex; gap: 12px; align-items: flex-start; }
  .job .body { flex: 1; min-width: 0; }
  .job .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin: 8px 0 6px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .job.done .bar > div { background: var(--ok); }
  .actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .actions a { text-decoration: none; }
  .error { color: var(--err); font-size: 13px; word-break: break-word; }
  .empty { color: var(--muted); font-size: 14px; }
  @media (max-width: 560px) {
    h1 { font-size: 20px; margin-bottom: 14px; }
    .panel { padding: 12px; border-radius: 10px; }
    .url-row { flex-basis: 100%; }
    .controls { flex: 1 1 100%; }
    .controls select { flex: 1; min-width: 0; }
    .controls button { flex: 1; }
    .job img, .preview img { width: 96px; }
    .job .title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .actions { gap: 8px; }
    .actions > *, .actions a button { flex: 1; width: 100%; }
    .actions button.small { min-height: 40px; }
  }
</style>
</head>
<body>
<main>
  <h1>yt-dlp web</h1>

  <div class="panel">
    <form id="form">
      <div class="url-row">
        <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="go" placeholder="Paste a video URL" required>
        <button type="button" id="paste" hidden>Paste</button>
      </div>
      <div class="controls">
        <select id="preset" aria-label="Quality"></select>
        <button class="primary" id="go" type="submit">Download</button>
      </div>
    </form>
    <div class="preview" id="preview">
      <img id="pv-thumb" alt="">
      <div>
        <div id="pv-title" style="font-weight:600"></div>
        <div class="meta" id="pv-meta"></div>
      </div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <h2>Downloads</h2>
  <div class="jobs" id="jobs"><div class="empty">Nothing yet.</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let preview = null;       // info for the URL currently in the box
let previewFor = "";
let pollTimer = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function fmtBytes(n) {
  if (!n) return "";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + u[i];
}
function fmtTime(s) {
  if (s == null) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadPresets() {
  const presets = await api("/api/presets");
  $("preset").innerHTML = presets.map((p) => `<option value="${p.id}">${esc(p.label)}</option>`).join("");
  try { const saved = localStorage.getItem("preset"); if (saved) $("preset").value = saved; } catch {}
}
$("preset").addEventListener("change", () => {
  try { localStorage.setItem("preset", $("preset").value); } catch {}
});

// Fetch title/thumbnail shortly after a URL is pasted or typed.
let infoTimer = null;
$("url").addEventListener("input", () => {
  clearTimeout(infoTimer);
  infoTimer = setTimeout(fetchInfo, 500);
});

async function fetchInfo() {
  const url = $("url").value.trim();
  if (!url || url === previewFor) return;
  previewFor = url;
  preview = null;
  $("preview").classList.remove("show");
  $("msg").textContent = "";
  if (!/^https?:\/\//i.test(url)) return;
  $("msg").style.color = "var(--muted)";
  $("msg").textContent = "Looking up video…";
  try {
    const info = await api("/api/info", { method: "POST", body: { url } });
    if (url !== $("url").value.trim()) return;
    preview = info;
    $("pv-thumb").src = info.thumbnail || "";
    $("pv-title").textContent = info.title || url;
    $("pv-meta").textContent = [info.uploader, fmtTime(info.duration), info.max_height ? info.max_height + "p max" : ""]
      .filter(Boolean).join(" · ");
    $("preview").classList.add("show");
    $("msg").textContent = "";
  } catch (e) {
    if (url !== $("url").value.trim()) return;
    $("msg").style.color = "var(--err)";
    $("msg").textContent = e.message;
  }
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const url = $("url").value.trim();
  if (!url) return;
  $("go").disabled = true;
  try {
    const p = previewFor === url ? preview : null;
    await api("/api/jobs", {
      method: "POST",
      body: { url, preset: $("preset").value, title: p?.title, thumbnail: p?.thumbnail },
    });
    $("url").value = "";
    previewFor = "";
    preview = null;
    $("preview").classList.remove("show");
    $("msg").textContent = "";
    refresh();
  } catch (e) {
    $("msg").style.color = "var(--err)";
    $("msg").textContent = e.message;
  } finally {
    $("go").disabled = false;
  }
});

function statusLine(j) {
  switch (j.status) {
    case "queued": return "Queued";
    case "downloading": {
      const parts = [`${j.percent.toFixed(1)}%`];
      if (j.stage) parts.unshift(`Downloading ${j.stage}`);
      if (j.speed) parts.push(fmtBytes(j.speed) + "/s");
      if (j.eta != null) parts.push("ETA " + fmtTime(j.eta));
      return parts.join(" · ");
    }
    case "processing": return "Processing" + (j.stage ? ` (${j.stage.replace(/^FFmpeg/, "")})` : "") + "…";
    case "done": return [j.preset_label, fmtBytes(j.filesize)].filter(Boolean).join(" · ");
    case "cancelled": return "Cancelled";
    case "error": return "Failed";
  }
  return j.status;
}

function renderJobs(list) {
  if (!list.length) {
    $("jobs").innerHTML = '<div class="empty">Nothing yet.</div>';
    return;
  }
  $("jobs").innerHTML = list.map((j) => {
    const active = ["queued", "downloading", "processing"].includes(j.status);
    const width = j.status === "done" ? 100 : j.status === "processing" ? 100 : j.percent;
    return `
      <div class="panel job ${j.status}">
        ${j.thumbnail ? `<img src="${esc(j.thumbnail)}" alt="">` : ""}
        <div class="body">
          <div class="title" title="${esc(j.filename || j.title || j.url)}">${esc(j.filename || j.title || j.url)}</div>
          <div class="meta">${esc(statusLine(j))}</div>
          ${active || j.status === "done" ? `<div class="bar"><div style="width:${width}%"></div></div>` : ""}
          ${j.error ? `<div class="error">${esc(j.error)}</div>` : ""}
          <div class="actions">
            ${j.status === "done" ? `<a href="/api/jobs/${j.id}/file"><button class="small primary">Save file</button></a>` : ""}
            ${active ? `<button class="small" data-cancel="${j.id}">Cancel</button>` : `<button class="small" data-remove="${j.id}">Remove</button>`}
          </div>
        </div>
      </div>`;
  }).join("");
}

$("jobs").addEventListener("click", async (ev) => {
  const cancel = ev.target.closest("[data-cancel]")?.dataset.cancel;
  const remove = ev.target.closest("[data-remove]")?.dataset.remove;
  try {
    if (cancel) await api(`/api/jobs/${cancel}/cancel`, { method: "POST" });
    if (remove) await api(`/api/jobs/${remove}`, { method: "DELETE" });
  } catch (e) {
    $("msg").style.color = "var(--err)";
    $("msg").textContent = e.message;
  }
  if (cancel || remove) refresh();
});

async function refresh() {
  clearTimeout(pollTimer);
  let list = [];
  try {
    list = await api("/api/jobs");
    renderJobs(list);
  } catch {}
  const active = list.some((j) => ["queued", "downloading", "processing"].includes(j.status));
  pollTimer = setTimeout(refresh, active ? 1000 : 5000);
}

// The clipboard API only works over HTTPS or localhost, so the button stays
// hidden when the app is opened over plain http on the LAN.
if (navigator.clipboard?.readText && window.isSecureContext) {
  $("paste").hidden = false;
  $("paste").addEventListener("click", async () => {
    try {
      const text = (await navigator.clipboard.readText()).trim();
      if (text) { $("url").value = text; fetchInfo(); }
    } catch {}
  });
}
// Autofocus pops the keyboard on phones, so only do it with a real pointer.
if (matchMedia("(pointer: fine)").matches) $("url").focus();
// Accept links shared via ?url=... (handy for bookmarklets / share shortcuts).
const shared = new URLSearchParams(location.search).get("url");
if (shared) { $("url").value = shared; fetchInfo(); history.replaceState(null, "", location.pathname); }

loadPresets();
refresh();
</script>
</body>
</html>
